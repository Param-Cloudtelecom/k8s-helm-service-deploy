# Default values for the `service` chart. Override per-environment with
# environments/values-{dev,prod}.yaml — see the root README.

replicaCount: 2

image:
  repository: ghcr.io/param-cloudtelecom/cicd-demo-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Plain, non-secret environment variables surfaced via a ConfigMap and
# mounted with envFrom. Real secrets belong in a Kubernetes Secret /
# external-secrets integration, never in here.
env:
  ENVIRONMENT: dev
  LOG_LEVEL: info

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: demo-app.example.com
  tls:
    enabled: false
    secretName: demo-app-tls

nodeSelector: {}
tolerations: []
affinity: {}
