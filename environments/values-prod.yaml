# helm upgrade --install demo-app ./charts/service -f environments/values-prod.yaml

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 512Mi

env:
  ENVIRONMENT: prod
  LOG_LEVEL: warning

ingress:
  enabled: true
  host: demo-app.example.com
  tls:
    enabled: true
    secretName: demo-app-prod-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: service
