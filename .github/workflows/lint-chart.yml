name: Lint & template chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm lint
        run: helm lint charts/service

      - name: helm template (default values)
        run: helm template demo-app charts/service

      - name: helm template (dev overrides)
        run: helm template demo-app charts/service -f environments/values-dev.yaml

      - name: helm template (prod overrides)
        run: helm template demo-app charts/service -f environments/values-prod.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered manifests against the Kubernetes API schema
        run: |
          helm template demo-app charts/service -f environments/values-prod.yaml \
            | kubeconform -strict -summary
